<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="card">

            <div class="logo">🌐</div>

            <h1>Добро пожаловать!</h1>

            <p class="subtitle">
                Введите номер телефона для регистрации
            </p>


            <!-- Форма регистрации -->
            <form id="registrationForm">

                <label for="phone">Номер телефона</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+7 (999) 123-45-67"
                    autocomplete="tel"
                    required
                >

                <button type="submit" class="register-button">
                    Зарегистрироваться
                </button>

            </form>


            <!-- Сообщение после регистрации -->
            <div id="message"></div>


            <!-- Telegram -->
            <div class="telegram-section" id="telegramSection" style="display: none;">

                <p>
        После регистрации перейдите в наш Telegram-канал
                </p>

                <a
    id="telegramButton"
    href="https://t.me/+usf3cfHXiYc1YzJi"
    target="_blank"
    rel="noopener noreferrer"
    class="telegram-button"
    style="display: none;"
                >
    📲 Открыть Telegram
                </a>

             </div>


            <!-- QR-код -->
            <div class="qr-section">

                <h2>Открыть сайт с телефона</h2>

                <p>
                    Наведите камеру телефона на QR-код
                    </p>

                <div class="qr-wrapper">

                    <img
                    src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fviz7s.github.io%2Fmy-site%2F"
                    alt="QR-код для открытия сайта"
>
                    >

                </div>

                <p class="qr-link">
                    vlz7s.github.io/my-site
                </p>

            </div>

        </div>

    </div>


    <script>
    document.addEventListener("DOMContentLoaded", function () {

    const form = 
    document.getElementById("registrationForm");
    const phoneInput =
     document.getElementById("phone");
    const message =
     document.getElementById("message");

    form.addEventListener("submit", function (event) {

        event.preventDefault();

        const phone =
     phoneInput.value.trim();

        // Проверяем, что номер введён
        if (phone.length < 5) {
            message.textContent = "Введите корректный номер телефона.";
            message.className = "error";
            return;
        }

        // Показываем сообщение
        message.textContent = "✅ Регистрация выполнена!";
        message.className = "success";

        // Переход в Telegram
        window.location.href = "https://t.me/+usf3cfHXiYc1YzJi";
    });

    });
    </script>
